  // ---------- KML parsing helpers ----------
  function parseCoords(text){
    return text.trim().split(/\s+/).filter(Boolean).map(s=>{
      const parts = s.split(',').map(Number);
      return [parts[0]||0, parts[1]||0, parts[2]||0];
    });
  }

  function getChildText(el, tag){
    for(const c of Array.from(el.children||[])){
      if(c.tagName === tag) return c.textContent;
    }
    return null;
  }

  function getLayerPath(pm){
    let parts = [];
    let node = pm.parentElement;
    while(node){
      if(node.tagName === 'Folder' || node.tagName === 'Document'){
        const nm = getChildText(node,'name');
        if(nm && nm.trim()) parts.unshift(nm.trim());
      }
      node = node.parentElement;
    }
    return parts.join(' / ');
  }

  function extractGeometries(pm, layer, geoms){
    function handle(el){
      if(!el) return;
      if(el.tagName === 'Point'){
        const c = getChildText(el,'coordinates');
        if(c){ const pts = parseCoords(c); if(pts.length) geoms.push({type:'point', layer, rings:[[pts[0]]]}); }
      } else if(el.tagName === 'LineString'){
        const c = getChildText(el,'coordinates');
        if(c){ const pts = parseCoords(c); if(pts.length>1) geoms.push({type:'line', layer, rings:[pts]}); }
      } else if(el.tagName === 'Polygon'){
        const outerC = el.querySelector('outerBoundaryIs > LinearRing > coordinates');
        const rings = [];
        if(outerC){ const pts = parseCoords(outerC.textContent); if(pts.length>2) rings.push(pts); }
        el.querySelectorAll('innerBoundaryIs > LinearRing > coordinates').forEach(ic=>{
          const pts = parseCoords(ic.textContent);
          if(pts.length>2) rings.push(pts);
        });
        if(rings.length) geoms.push({type:'polygon', layer, rings});
      } else if(el.tagName === 'MultiGeometry'){
        Array.from(el.children).forEach(handle);
      }
    }
    Array.from(pm.children).forEach(handle);
  }

  function parseKMLText(text){
    const xml = new DOMParser().parseFromString(text, 'text/xml');
    const errNode = xml.querySelector('parsererror');
    if(errNode) throw new Error('errInvalidKML');
    const geoms = [];
    const placemarks = Array.from(xml.getElementsByTagName('Placemark'));
    placemarks.forEach(pm=>{
      const layer = getLayerPath(pm) || 'KML';
      extractGeometries(pm, layer, geoms);
    });
    if(geoms.length === 0) throw new Error('errNoGeom');
    return geoms;
  }

  async function readFileAsGeoms(file){
    const lower = file.name.toLowerCase();
    if(lower.endsWith('.kmz')){
      const buf = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      let entryName = Object.keys(zip.files).find(n=>n.toLowerCase() === 'doc.kml');
      if(!entryName) entryName = Object.keys(zip.files).find(n=>n.toLowerCase().endsWith('.kml'));
      if(!entryName) throw new Error('errNoKmlInKmz');
      const text = await zip.files[entryName].async('string');
      return parseKMLText(text);
    } else if(lower.endsWith('.kml')){
      const text = await file.text();
      return parseKMLText(text);
    } else {
      throw new Error('errUnsupported');
    }
  }

  function computeBBox(geoms){
    let minLon=Infinity, minLat=Infinity, maxLon=-Infinity, maxLat=-Infinity;
    geoms.forEach(g=>g.rings.forEach(r=>r.forEach(p=>{
      if(p[0]<minLon) minLon=p[0];
      if(p[0]>maxLon) maxLon=p[0];
      if(p[1]<minLat) minLat=p[1];
      if(p[1]>maxLat) maxLat=p[1];
    })));
    if(!isFinite(minLon)){ minLon=minLat=0; maxLon=maxLat=1; }
    return [minLon,minLat,maxLon,maxLat];
  }

  function buildPreviewSVG(geoms, bbox){
    const w=150,h=96,pad=8;
    const [minLon,minLat,maxLon,maxLat] = bbox;
    const spanLon = Math.max(maxLon-minLon, 1e-9);
    const spanLat = Math.max(maxLat-minLat, 1e-9);
    const scale = Math.min((w-2*pad)/spanLon, (h-2*pad)/spanLat);
    const offX = pad + ((w-2*pad) - spanLon*scale)/2;
    const offY = pad + ((h-2*pad) - spanLat*scale)/2;
    function toXY(p){
      const x = offX + (p[0]-minLon)*scale;
      const y = h - (offY + (p[1]-minLat)*scale);
      return [x,y];
    }
    let grid='';
    for(let gx=0; gx<=w; gx+=15) grid += `<line x1="${gx}" y1="0" x2="${gx}" y2="${h}" class="pv-grid"/>`;
    for(let gy=0; gy<=h; gy+=15) grid += `<line x1="0" y1="${gy}" x2="${w}" y2="${gy}" class="pv-grid"/>`;
    let body='';
    geoms.forEach(g=>{
      if(g.type==='point'){
        const [x,y] = toXY(g.rings[0][0]);
        body += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2" class="pv-pt"/>`;
      } else {
        g.rings.forEach((ring, idx)=>{
          const d = ring.map((p,i)=> (i===0?'M':'L') + toXY(p).map(n=>n.toFixed(1)).join(',')).join(' ');
          const closed = g.type==='polygon';
          const cls = g.type==='polygon' ? (idx===0?'pv-poly':'pv-hole') : 'pv-line';
          body += `<path d="${d}${closed?' Z':''}" class="${cls}"/>`;
        });
      }
    });
    return `<svg viewBox="0 0 ${w} ${h}" class="preview-svg"><rect width="${w}" height="${h}" class="pv-bg"/>${grid}${body}</svg>`;
  }

  function countStats(geoms){
    const layers = new Set();
    let pts=0, lines=0, polys=0;
    geoms.forEach(g=>{
      layers.add(g.layer);
      if(g.type==='point') pts++;
      else if(g.type==='line') lines++;
      else if(g.type==='polygon') polys++;
    });
    return {layers: layers.size, pts, lines, polys, layerNames:[...layers]};
  }

  async function handleFiles(files){
    const valid = files.filter(f=>/\.(kml|kmz)$/i.test(f.name));
    if(valid.length===0) return;
    filesPanel.style.display='block';
    optionsPanel.style.display='block';

    for(const file of valid){
      const entry = { id: idSeq++, name: file.name, baseName: file.name.replace(/\.(kml|kmz)$/i,''), geoms: [], bbox:null, errorKey:null };
      loadedFiles.push(entry);
      renderFileList();
      try{
        const geoms = await readFileAsGeoms(file);
        entry.geoms = geoms;
        entry.bbox = computeBBox(geoms);
      } catch(err){
        entry.errorKey = err.message || 'errUnsupported';
      }
      renderFileList();
    }
    updateConvertState();
  }

  function renderFileList(){
    fileList.innerHTML = '';
    loadedFiles.forEach(entry=>{
      const row = document.createElement('div');
      row.className = 'file-row';

      const previewBox = document.createElement('div');
      previewBox.className = 'preview-box';
      if(entry.geoms && entry.geoms.length){
        previewBox.innerHTML = buildPreviewSVG(entry.geoms, entry.bbox);
      } else {
        previewBox.innerHTML = `<svg viewBox="0 0 150 96" class="preview-svg"><rect width="150" height="96" class="pv-bg"/></svg>`;
      }

      const meta = document.createElement('div');
      meta.className = 'file-meta';
      if(entry.errorKey){
        meta.innerHTML = `<div class="fname">${escapeHtml(entry.name)}</div><div class="ferror">⚠ ${escapeHtml(t(entry.errorKey))}</div>`;
      } else if(entry.geoms.length){
        const st = countStats(entry.geoms);
        meta.innerHTML = `
          <div class="fname">${escapeHtml(entry.name)}</div>
          <div class="fstats">
            <span>${t('statPt')}: ${st.pts}</span>
            <span>${t('statLine')}: ${st.lines}</span>
            <span>${t('statPoly')}: ${st.polys}</span>
            <span>${t('statLayer')}: ${st.layers}</span>
          </div>
          <div class="flayers">${st.layerNames.slice(0,4).map(escapeHtml).join(' · ')}${st.layerNames.length>4?' ...':''}</div>
        `;
      } else {
        meta.innerHTML = `<div class="fname">${escapeHtml(entry.name)}</div><div class="fstats">${t('processing')}</div>`;
      }

      const removeBtn = document.createElement('button');

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateConvertState(){
    const ready = loadedFiles.some(e=>!e.errorKey && e.geoms.length);
    convertBtn.disabled = !ready;
  }

  // ---------- DXF generation ----------
  function sanitizeLayer(name){
    let n = (name||'KML').toString().trim().replace(/[<>/\\":;?*|,=`]/g,'_').replace(/\s+/g,'_');
    return n.slice(0,255) || 'KML';
  }

  function projectGeoms(geoms, mode){
    if(mode === 'raw'){
      return geoms.map(g=>({...g, rings: g.rings.map(r=>r.map(p=>[p[0],p[1],p[2]||0]))}));
    }
    let sumLon=0,sumLat=0,n=0;
    geoms.forEach(g=>g.rings.forEach(r=>r.forEach(p=>{ sumLon+=p[0]; sumLat+=p[1]; n++; })));
    const lon0 = n? sumLon/n : 0;
    const lat0 = n? sumLat/n : 0;
    const cosLat = Math.cos(lat0*Math.PI/180);
    return geoms.map(g=>({...g, rings: g.rings.map(r=>r.map(p=>{
      const x = (p[0]-lon0) * 111320 * cosLat;
      const y = (p[1]-lat0) * 110540;
      return [x, y, p[2]||0];
    }))}));
  }

  function buildDXF(fileEntries, mode, precision){
    let allGeoms = [];
    const multi = fileEntries.length > 1;
    fileEntries.forEach(fe=>{
      fe.geoms.forEach(g=>{
        const layerName = sanitizeLayer((multi ? fe.baseName + '_' : '') + (g.layer || 'KML'));
        allGeoms.push({...g, layer: layerName});
      });
    });
    const projected = projectGeoms(allGeoms, mode);
    const layerSet = [...new Set(projected.map(g=>g.layer))];
    const fmt = n => n.toFixed(precision);

    let ents = '';
    projected.forEach(g=>{
      if(g.type === 'point'){
        const [x,y,z] = g.rings[0][0];
        ents += `0\nPOINT\n8\n${g.layer}\n10\n${fmt(x)}\n20\n${fmt(y)}\n30\n${fmt(z)}\n`;
      } else {
        g.rings.forEach(ring=>{
          const closed = g.type === 'polygon';
          ents += `0\nPOLYLINE\n8\n${g.layer}\n66\n1\n70\n${closed?1:0}\n`;
          ring.forEach(p=>{
            ents += `0\nVERTEX\n8\n${g.layer}\n10\n${fmt(p[0])}\n20\n${fmt(p[1])}\n30\n${fmt(p[2])}\n`;
          });
          ents += `0\nSEQEND\n`;
        });
      }
    });

    let layerDefs = '';
    layerSet.forEach(l=>{
      layerDefs += `0\nLAYER\n2\n${l}\n70\n0\n62\n7\n6\nCONTINUOUS\n`;
    });

    return `0
SECTION
2
HEADER
9
$ACADVER
1
AC1009
0
ENDSEC
0
SECTION
2
TABLES
0
TABLE
2
LAYER
70
${layerSet.length}
${layerDefs}0
ENDTAB
0
ENDSEC
0
SECTION
2
ENTITIES
${ents}0
ENDSEC
0
EOF
`;
  }

  function downloadBlob(content, filename, type){
    const blob = new Blob([content], {type: type || 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }

  convertBtn.addEventListener('click', async ()=>{
    const valid = loadedFiles.filter(e=>!e.errorKey && e.geoms.length);
    if(valid.length===0) return;
    const mode = document.querySelector('input[name=coordMode]:checked').value;
    const outMode = document.querySelector('input[name=outMode]:checked').value;
    let precision = parseInt(precisionInput.value,10);
    if(isNaN(precision) || precision<0) precision = 3;
    if(precision>8) precision = 8;

    statusMsg.textContent = t('statusConverting');
    statusMsg.className = 'status-msg';
    convertBtn.disabled = true;

    try{
      if(outMode === 'merged'){
        const dxf = buildDXF(valid, mode, precision);
        const name = valid.length===1 ? valid[0].baseName + '.dxf' : 'converted_merged.dxf';
        downloadBlob(dxf, name, 'application/dxf');
      } else {
        const zip = new JSZip();
        valid.forEach(fe=>{
          const dxf = buildDXF([fe], mode, precision);
          zip.file(fe.baseName + '.dxf', dxf);
        });
        const blob = await zip.generateAsync({type:'blob'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'dxf_output.zip';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
      }
      statusMsg.textContent = t('statusOk');
      statusMsg.className = 'status-msg ok';
    } catch(err){
      statusMsg.textContent = t('statusErr') + (err.message || '');
      statusMsg.className = 'status-msg err';
    } finally {
      convertBtn.disabled = false;
    }
  });

  applyLang();
})();
</script>
</body>
</html>
